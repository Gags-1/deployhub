services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://deployhub:deployhub@postgres:5432/deployhub
    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: deployhub
      POSTGRES_PASSWORD: deployhub
      POSTGRES_DB: deployhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deployhub -d deployhub"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
